<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>计算失败数据处理 · MIIA-AI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;background:#F4F7FB;color:#1F2937;
  font-size:13px;display:flex;flex-direction:column;overflow:hidden}
button{font-family:inherit;cursor:pointer}
/* 顶栏 */
.nav{height:48px;background:#1E3A6F;color:#fff;display:flex;align-items:center;padding:0 16px;flex:0 0 48px}
.nav .lg{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.5px}
.nav .lg i{width:24px;height:24px;border-radius:5px;background:#fff;color:#1E3A6F;font-style:normal;
  font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.nav .lg em{font-style:normal;font-size:12.5px;opacity:.85;font-weight:400;border-left:1px solid rgba(255,255,255,.28);padding-left:9px}
.nav .sp{flex:1}
.nav .org{text-align:right;line-height:1.25;margin-right:14px}
.nav .org b{display:block;font-size:12px;font-weight:600}
.nav .org span{font-size:11px;opacity:.75}
.nav .win{display:flex;gap:12px;font-size:14px;opacity:.85}
.nav .ver{font-size:11px;padding:1px 6px;border-radius:3px;background:rgba(255,255,255,.16);
  color:#fff;margin-left:8px;letter-spacing:.2px}
/* 内容 */
.wrap{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px 16px 12px;overflow:hidden}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex:0 0 auto}
.hd h1{font-size:16px;font-weight:700;color:#173D43}
.hd .sp{flex:1}
.btn{height:30px;padding:0 12px;border:1px solid #D7DEE8;background:#fff;border-radius:4px;color:#374151;font-size:12.5px}
.btn:hover{border-color:#2F6BFF;color:#2F6BFF}
.btn.pri{background:#2F6BFF;border-color:#2F6BFF;color:#fff}
.btn.pri:hover{background:#1D5BEA;color:#fff}
.btn.pri[disabled]{background:#B9C6E4;border-color:#B9C6E4;cursor:not-allowed}
/* 页签 */
.tabs{display:flex;gap:22px;border-bottom:1px solid #E5EAF2;margin-bottom:10px;flex:0 0 auto}
.tabs div{padding:0 2px 9px;font-size:13.5px;color:#6B7280;cursor:pointer;position:relative;top:1px}
.tabs div.on{color:#2F6BFF;font-weight:600;border-bottom:2px solid #2F6BFF}
.tabs div em{font-style:normal;font-size:12px;color:#8A94A6;margin-left:4px}
/* 筛选 */
.fbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid #E5EAF2;
  border-radius:6px;padding:10px 12px;margin-bottom:10px;flex:0 0 auto}
.fbar .fi{display:flex;align-items:center;gap:6px}
.fbar label{color:#5B6472;font-size:12.5px;white-space:nowrap}
.fbar input,.fbar select{height:30px;border:1px solid #D7DEE8;border-radius:4px;padding:0 8px;font-size:12.5px;
  color:#1F2937;background:#fff;outline:none;font-family:inherit}
.fbar input{width:132px}
.fbar input:focus,.fbar select:focus{border-color:#2F6BFF;box-shadow:0 0 0 2px rgba(47,107,255,.12)}
.fbar .sp{flex:1}
/* 表格 */
.card{background:#fff;border:1px solid #E5EAF2;border-radius:6px;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.tw{flex:1;min-height:0;overflow:auto}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
thead th{position:sticky;top:0;z-index:2;background:#F7F9FC;color:#4B5563;font-weight:600;text-align:left;
  padding:9px 10px;border-bottom:1px solid #E5EAF2;white-space:nowrap}
tbody td{padding:9px 10px;border-bottom:1px solid #F0F3F8;color:#1F2937;vertical-align:middle}
tbody tr:hover td{background:#F8FAFF}
tbody tr[data-row]{cursor:pointer}
td.c,th.c{width:38px;text-align:center}
td.nw{white-space:nowrap}
.tool{max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rs{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#8A94A6}
.url{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#2F6BFF}
.dot{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.dot i{width:6px;height:6px;border-radius:50%;flex:0 0 6px}
.dot.fail i{background:#E5484D}
.dot.fail{color:#E5484D}
.dot.ok i{background:#16A34A}
.dot.ok{color:#16A34A}
.dot.run i{background:#FA8C16}
.dot.run{color:#FA8C16}
.lk{color:#2F6BFF;cursor:pointer;text-decoration:none}
.lk:hover{text-decoration:underline}
.lk+.lk{margin-left:12px}
.lk.grey{color:#8A94A6}
input[type=checkbox]{width:14px;height:14px;accent-color:#2F6BFF;cursor:pointer}
/* 底部分页 */
.pg{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid #E5EAF2;
  color:#6B7280;font-size:12.5px;background:#fff}
.pg .sp{flex:1}
.pg .p{min-width:26px;height:26px;border:1px solid #D7DEE8;background:#fff;border-radius:4px;color:#4B5563;font-size:12.5px}
.pg .p.on{background:#2F6BFF;border-color:#2F6BFF;color:#fff}
.pg .p[disabled]{color:#C3CAD6;cursor:not-allowed}
.empty{padding:58px 0;text-align:center;color:#9AA4B2;font-size:13px}
.empty b{display:block;font-size:32px;opacity:.25;margin-bottom:8px}
/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(15,23,42,.42);display:flex;align-items:center;justify-content:center;z-index:50}
.mask.hidden{display:none}
.dlg{background:#fff;border-radius:8px;width:560px;max-width:94vw;max-height:86vh;display:flex;flex-direction:column;
  box-shadow:0 18px 48px rgba(15,23,42,.22)}
.dh{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid #EEF1F6}
.dh h3{font-size:14.5px;font-weight:700;color:#173D43}
.dh .sp{flex:1}
.dh .x{width:24px;height:24px;line-height:22px;text-align:center;border-radius:4px;color:#8A94A6;cursor:pointer;font-size:16px}
.dh .x:hover{background:#F1F4F9;color:#374151}
.db{padding:14px 16px;overflow-y:auto}
.f{margin-bottom:13px}
.f>label{display:block;font-size:12.5px;color:#4B5563;margin-bottom:6px}
.f>label i{color:#E5484D;font-style:normal;margin-right:3px}
.f select,.f input[type=text],.f input[type=url]{width:100%;height:32px;border:1px solid #D7DEE8;border-radius:4px;
  padding:0 9px;font-size:12.5px;color:#1F2937;outline:none;font-family:inherit}
.f select:focus,.f input:focus{border-color:#2F6BFF;box-shadow:0 0 0 2px rgba(47,107,255,.12)}
.f input.err{border-color:#E5484D;box-shadow:0 0 0 2px rgba(229,72,77,.12)}
.hint{font-size:11.5px;color:#8A94A6;margin-top:5px;line-height:1.5}
.hint.err{color:#E5484D}
.updList{max-height:236px;overflow-y:auto;border:1px solid #EEF1F6;border-radius:5px}
.updList .u{padding:9px 10px;border-bottom:1px solid #F4F6FA}
.updList .u:last-child{border-bottom:0}
.updList .u .t{font-size:12.5px;color:#1F2937;margin-bottom:5px}
.updList .u .t em{font-style:normal;color:#8A94A6;margin-left:6px}
.updList .u input{width:100%;height:29px;border:1px solid #D7DEE8;border-radius:4px;padding:0 8px;font-size:12px;
  outline:none;font-family:inherit;color:#1F2937}
.updList .u input:focus{border-color:#2F6BFF}
.updList .u input.err{border-color:#E5484D}
.df{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid #EEF1F6}
.toast{position:fixed;left:50%;top:64px;transform:translateX(-50%) translateY(-8px);background:#1F2937;color:#fff;
  padding:9px 16px;border-radius:6px;font-size:12.5px;opacity:0;pointer-events:none;transition:.22s;z-index:80}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* 抽屉：影像生命周期 */
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.drw{position:fixed;top:0;right:0;bottom:0;width:min(660px,42vw);background:#fff;z-index:40;
  display:flex;flex-direction:column;box-shadow:-10px 0 34px rgba(15,23,42,.16);border-left:1px solid #E5EAF2}
.drw.hidden{display:none}
.drh{display:flex;align-items:center;gap:9px;padding:13px 16px;border-bottom:1px solid #EEF1F6;flex:0 0 auto}
.drh h3{font-size:14.5px;font-weight:700;color:#173D43}
.drh .sp{flex:1}
.drh .x{width:24px;height:24px;line-height:22px;text-align:center;border-radius:4px;color:#8A94A6;cursor:pointer;font-size:16px}
.drh .x:hover{background:#F1F4F9;color:#374151}
.badge{font-size:11.5px;padding:2px 7px;border-radius:9px;background:#DCFCE7;color:#15803D}
.badge.grey{background:#F1F4F9;color:#6B7280}
.dinfo{flex:0 0 auto;padding:12px 16px;border-bottom:1px solid #EEF1F6;background:#FAFBFD;display:grid;
  grid-template-columns:1fr 1fr;gap:7px 14px;font-size:12.5px}
.dinfo div{display:flex;gap:6px;min-width:0}
.dinfo label{color:#8A94A6;flex:0 0 52px}
.dinfo span{color:#1F2937;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dinfo .full{grid-column:1 / -1}
.dtl{flex:1;min-height:0;overflow-y:auto;padding:14px 16px 18px}
.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:#E8EDF5}
.ti{position:relative;padding-bottom:16px}
.ti:last-child{padding-bottom:0}
.tdot{position:absolute;left:-26px;top:1px;width:16px;height:16px;border-radius:50%;background:#16A34A;
  color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;font-weight:700}
.ti.bad .tdot{background:#E5484D}
.tt{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tt b{font-size:13px;color:#1F2937}
.ti.bad .tt b{color:#E5484D}
.tt .tm{font-size:11.5px;color:#9AA4B2}
.tt .tagg{margin-left:auto;font-size:11px;padding:1px 7px;border-radius:9px}
.tagg.calc{background:#F3E8FF;color:#7E22CE}
.tagg.start{background:#DCFCE7;color:#15803D}
.tagg.match{background:#DBEAFE;color:#1D4ED8}
.tagg.arch{background:#FFEDD5;color:#C2410C}
.tagg.recv{background:#E0F2FE;color:#0369A1}
.tx{margin-top:5px;font-size:12px;color:#5B6472;line-height:1.65;word-break:break-all}
.tx .alg{display:block;color:#374151}
.ta{margin-top:8px;display:flex;gap:8px}
</style>
</head>
<body>
<div class="nav">
  <div class="lg"><i>YH</i>MIIA-AI<em>影像应用中心</em><span class="ver">v2.0</span></div>
  <div class="sp"></div>
  <div class="org"><b>南昌影禾医脉智能科技有限公司</b><span>影像质控中心</span></div>
  <div class="win"><span>—</span><span>▢</span><span>✕</span></div>
</div>

<div class="wrap">
  <div class="hd">
    <h1>计算失败数据处理</h1>
    <div class="sp"></div>
    <button class="btn" id="btnExport">导出</button>
    <button class="btn pri" id="btnBatch">更新状态</button>
  </div>

  <div class="tabs">
    <div class="on" data-tab="fail">计算失败<em id="nFail">0</em></div>
    <div data-tab="done">已更新成功<em id="nDone">0</em></div>
  </div>

  <div class="fbar">
    <div class="fi"><label>机构名称</label>
      <select id="fOrg"><option value="">全部机构</option></select>
    </div>
    <div class="fi"><label>患者号</label><input id="fPat" placeholder="请输入"></div>
    <div class="fi"><label>检查号</label><input id="fStudy" placeholder="请输入"></div>
    <div class="fi"><label>AI工具</label>
      <select id="fTool"><option value="">全部</option></select>
    </div>
    <div class="sp"></div>
    <button class="btn" id="btnReset">重置</button>
    <button class="btn pri" id="btnQuery">查询</button>
  </div>

  <div class="card">
    <div class="tw">
      <table>
        <thead>
          <tr>
            <th class="c"><input type="checkbox" id="ckAll"></th>
            <th>机构名称</th>
            <th>患者号</th>
            <th>检查号</th>
            <th>AI工具</th>
            <th>失败原因</th>
            <th>计算状态</th>
            <th>结果地址</th>
            <th>失败时间</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
    <div class="pg">
      <span id="pgTotal">共 0 条</span>
      <span id="pgSel"></span>
      <div class="sp"></div>
      <select id="pgSize" style="height:26px;border:1px solid #D7DEE8;border-radius:4px;font-size:12px;padding:0 4px">
        <option value="20">20 条/页</option><option value="50">50 条/页</option>
      </select>
      <button class="p" id="pgPrev">‹</button>
      <span id="pgNums" style="display:flex;gap:6px"></span>
      <button class="p" id="pgNext">›</button>
    </div>
  </div>
</div>

<div class="drw hidden" id="drw">
  <div class="drh">
    <h3>影像生命周期</h3>
    <span class="badge" id="drwBadge">已完结</span>
    <div class="sp"></div>
    <a class="lk" id="drwRefresh">↻ 手动刷新</a>
    <div class="x" data-drwx>×</div>
  </div>
  <div class="dinfo" id="drwInfo"></div>
  <div class="dtl" id="drwTl"></div>
</div>

<div class="mask hidden" id="mkUpd">
  <div class="dlg">
    <div class="dh"><h3>更新计算状态</h3><div class="sp"></div><div class="x" data-x>×</div></div>
    <div class="db">
      <div class="f">
        <label><i>*</i>计算状态</label>
        <select id="updStatus">
          <option value="成功">计算成功</option>
          <option value="失败">计算失败</option>
          <option value="执行中">计算中</option>
        </select>
        <div class="hint" id="updTip">选择「计算成功」并填写结果地址后，被选数据将强制更新为计算成功</div>
      </div>
      <div class="f">
        <label><i>*</i>结果地址（URL）</label>
        <div class="updList" id="updList"></div>
        <div class="hint" id="updErr" style="display:none">请填写以 http:// 或 https:// 开头的结果地址</div>
      </div>
    </div>
    <div class="df">
      <button class="btn" data-x>取消</button>
      <button class="btn pri" id="btnUpdOk">确认更新</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
/* ---------- 数据 ---------- */
var ORGS = ['贵溪市中医院','赤壁市人民医院','南昌市第一医院','金华广福医院','遂川第一人民医院',
            '四川大学华西医院','郑州大学第一附属医院','杭州全景医学影像诊断中心'];
var TOOLS = ['CT胸部肺结节辅助诊断（联影）','CT胸部骨折辅助诊断（联影）','骨龄DR量化评估(联影)',
             'CTA头颈部辅助诊断（联影）','CTA心脏冠心病辅助诊断（联影）','肺结节筛查（推想）'];
var REASONS = ['算法服务调用超时（>600s）','影像序列不完整，缺少薄层序列','预处理-血管分割失败',
               '结果回传地址不可达','GPU 资源不足，任务被中断','厂商接口返回 500'];

function pad(n){ return n < 10 ? '0' + n : '' + n; }
function stamp(d){ return pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' +
  pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); }

var ROWS = (function(){
  var first = [
    ['CT胸部肺结节辅助诊断（联影）','算法服务调用超时（>600s）'],
    ['CT胸部骨折辅助诊断（联影）','影像序列不完整，缺少薄层序列'],
    ['骨龄DR量化评估(联影)','输入数据模态不匹配（非 DR 影像）'],
    ['CTA头颈部辅助诊断（联影）','预处理-头颈-血管分割失败'],
    ['CTA心脏冠心病辅助诊断（联影）','预处理-冠脉-校验年龄失败']
  ];
  var out = [], t = new Date(2026, 10, 3, 15, 22, 33);
  for (var i = 0; i < 128; i++){
    var o = i < 5 ? first[i] : null;
    var org = i < 5 ? '贵溪市中医院' : ORGS[(i * 3 + 1) % ORGS.length];
    var pat = i < 5 ? 'CT4039835' : 'CT' + (4039000 + i * 7);
    var study = i < 5 ? '0000822503' : '00008' + (23000 + i * 13);
    var tool = o ? o[0] : TOOLS[i % TOOLS.length];
    var reason = o ? o[1] : REASONS[i % REASONS.length];
    out.push({ id: 'R' + i, org: org, pat: pat, study: study, tool: tool,
               reason: reason, status: '失败', url: '', time: stamp(t) });
    t = new Date(t.getTime() - (3 + (i % 7)) * 60000);
  }
  return out;
})();

var S = { tab:'fail', org:'', pat:'', study:'', tool:'', page:1, size:20, sel:{}, upd:[], drw:'' };

function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function uniq(a){ var r = []; a.forEach(function(x){ if (r.indexOf(x) < 0) r.push(x); }); return r; }

function view(){
  return ROWS.filter(function (r){
    if (S.tab === 'fail' && r.status !== '失败') return false;
    if (S.tab === 'done' && r.status !== '成功') return false;
    if (S.org && r.org !== S.org) return false;
    if (S.tool && r.tool !== S.tool) return false;
    if (S.pat && r.pat.toLowerCase().indexOf(S.pat.toLowerCase()) < 0) return false;
    if (S.study && r.study.indexOf(S.study) < 0) return false;
    return true;
  });
}

function stDot(st){
  var c = st === '成功' ? 'ok' : st === '失败' ? 'fail' : 'run';
  var t = st === '成功' ? '计算成功' : st === '失败' ? '计算失败' : '计算中';
  return '<span class="dot ' + c + '"><i></i>' + t + '</span>';
}

function render(){
  var rows = view();
  var pages = Math.max(1, Math.ceil(rows.length / S.size));
  if (S.page > pages) S.page = pages;
  var st = (S.page - 1) * S.size, pageRows = rows.slice(st, st + S.size);

  document.getElementById('nFail').textContent = ROWS.filter(function(r){ return r.status === '失败'; }).length;
  document.getElementById('nDone').textContent = ROWS.filter(function(r){ return r.status === '成功'; }).length;

  var tb = document.getElementById('tb');
  if (!pageRows.length){
    tb.innerHTML = '<tr><td colspan="10"><div class="empty"><b>▤</b>' +
      (S.tab === 'done' ? '暂无已更新成功的数据' : '暂无计算失败的数据') + '</div></td></tr>';
  } else {
    tb.innerHTML = pageRows.map(function (r){
      var acts = r.status === '失败'
        ? '<a class="lk" data-upd="' + r.id + '">更新状态</a>'
        : '<a class="lk" data-view="' + r.id + '">查看结果</a><a class="lk grey" data-upd="' + r.id + '">重新更新</a>';
      return '<tr data-row="' + r.id + '">' +
        '<td class="c"><input type="checkbox" data-ck="' + r.id + '"' + (S.sel[r.id] ? ' checked' : '') + '></td>' +
        '<td class="nw">' + esc(r.org) + '</td>' +
        '<td class="nw">' + esc(r.pat) + '</td>' +
        '<td class="nw">' + esc(r.study) + '</td>' +
        '<td><div class="tool" title="' + esc(r.tool) + '">' + esc(r.tool) + '</div></td>' +
        '<td><div class="rs" title="' + esc(r.reason) + '">' + (r.reason ? esc(r.reason) : '—') + '</div></td>' +
        '<td class="nw">' + stDot(r.status) + '</td>' +
        '<td><div class="url" title="' + esc(r.url) + '">' + (r.url ? esc(r.url) : '—') + '</div></td>' +
        '<td class="nw">' + esc(r.time) + '</td>' +
        '<td class="nw">' + acts + '</td>' +
      '</tr>';
    }).join('');
  }

  var selN = Object.keys(S.sel).filter(function(k){ return S.sel[k]; }).length;
  document.getElementById('pgTotal').textContent = '共 ' + rows.length + ' 条';
  document.getElementById('pgSel').textContent = selN ? '已选 ' + selN + ' 条' : '';
  document.getElementById('pgPrev').disabled = S.page <= 1;
  document.getElementById('pgNext').disabled = S.page >= pages;
  var nums = '';
  for (var p = 1; p <= pages; p++){
    if (pages > 8 && p > 3 && p < pages - 2 && Math.abs(p - S.page) > 1) {
      if (p === 4) nums += '<span style="color:#9AA4B2">…</span>';
      continue;
    }
    nums += '<button class="p' + (p === S.page ? ' on' : '') + '" data-pg="' + p + '">' + p + '</button>';
  }
  document.getElementById('pgNums').innerHTML = nums;
  document.getElementById('ckAll').checked = pageRows.length > 0 && pageRows.every(function(r){ return S.sel[r.id]; });
  document.getElementById('btnBatch').disabled = selN === 0;
}

/* ---------- 弹窗 ---------- */
function openUpd(ids){
  ids = ids.filter(function (id){ return (ROWS.filter(function(r){ return r.id === id; })[0] || {}).status !== '成功' || true; });
  if (!ids.length) return;
  S.upd = ids;
  document.getElementById('updList').innerHTML = ids.map(function (id){
    var r = ROWS.filter(function(x){ return x.id === id; })[0];
    return '<div class="u"><div class="t">' + esc(r.org) + ' · ' + esc(r.study) + ' · ' + esc(r.tool) +
      '<em>' + esc(r.pat) + '</em></div>' +
      '<input class="updUrl" data-id="' + id + '" placeholder="https://" value="' + esc(r.url) + '"></div>';
  }).join('');
  document.getElementById('updStatus').value = '成功';
  document.getElementById('updErr').style.display = 'none';
  document.getElementById('mkUpd').classList.remove('hidden');
}
function closeUpd(){ document.getElementById('mkUpd').classList.add('hidden'); S.upd = []; }

function toast(m){
  var t = document.getElementById('toast');
  t.textContent = m; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove('on'); }, 2000);
}

function doUpdate(){
  var st = document.getElementById('updStatus').value;
  var inputs = [].slice.call(document.querySelectorAll('#updList .updUrl'));
  var ok = true, urls = {};
  inputs.forEach(function (i){
    var v = i.value.trim();
    var good = /^https?:\/\/.+/i.test(v);
    if (st === '成功' && !good){ ok = false; i.classList.add('err'); }
    else i.classList.remove('err');
    urls[i.getAttribute('data-id')] = v;
  });
  document.getElementById('updErr').style.display = ok ? 'none' : 'block';
  if (!ok) return;

  var n = 0;
  S.upd.forEach(function (id){
    var r = ROWS.filter(function(x){ return x.id === id; })[0];
    if (!r) return;
    r.status = st;
    if (st === '成功'){
      r.url = urls[id] || '';
      r.reason = '';
      var d = new Date();
      r.updated = pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    }
    n++;
  });
  S.sel = {};
  closeUpd();
  render();
  if (S.drw) renderDrw();
  toast(st === '成功' ? ('已更新 ' + n + ' 条数据为计算成功') : ('已更新 ' + n + ' 条数据状态为' + (st === '失败' ? '计算失败' : '计算中')));
}


/* ---------- 影像生命周期抽屉 ---------- */
var NAMES = ['王清','LI SHU CHENG','张明','李红','陈刚','刘洋','赵敏','孙健'];

function parseStamp(t){
  var m = /^(\d+)-(\d+) (\d+):(\d+):(\d+)$/.exec(t);
  if (!m) return new Date(2026, 10, 3, 15, 0, 0);
  return new Date(2026, +m[1] - 1, +m[2], +m[3], +m[4], +m[5]);
}
function idxOf(id){ return +String(id).replace('R', ''); }
function studyUid(r){ return '1.2.840.113619.2.472.3.2831158087.846.1792752619.' + (100 + idxOf(r.id)); }

function tlHtml(r){
  var i = idxOf(r.id);
  var base = parseStamp(r.time);
  var t0 = stamp(base);
  var t1 = stamp(new Date(base.getTime() - 56000));
  var ok = r.status === '成功';
  var head = ok
    ? '<div class="ti"><div class="tdot">✓</div><div><div class="tt"><b>计算成功</b>' +
      '<span class="tm">' + t0 + '</span><span class="tagg calc">计算</span></div>' +
      '<div class="tx">结果地址：' + esc(r.url || '—') + (r.updated ? '<br>更新时间：' + esc(r.updated) : '') + '</div>' +
      '<div class="ta"><a class="lk" data-view="' + r.id + '">查看结果</a>' +
      '<button class="btn sm" data-upd="' + r.id + '">重新更新</button></div></div></div>'
    : '<div class="ti bad"><div class="tdot">✕</div><div><div class="tt"><b>计算失败</b>' +
      '<span class="tm">' + t0 + '</span><span class="tagg calc">计算</span></div>' +
      '<div class="tx">失败原因：序列【' + studyUid(r) + '.<b>' + (39 + i) + '</b>】错误<br>信息：' + esc(r.reason) + '</div>' +
      '<div class="ta"><button class="btn sm" data-retry="' + r.id + '">↻ 手动重试</button>' +
      '<button class="btn sm pri" data-upd="' + r.id + '">更新状态</button></div></div></div>';

  var algs = TOOLS.slice(0, 4).map(function (a){ return '<span class="alg">' + esc(a) + '</span>'; }).join('');
  return '<div class="tl">' + head +
    '<div class="ti"><div class="tdot">✓</div><div><div class="tt"><b>计算开始</b>' +
      '<span class="tm">' + t1 + '</span><span class="tagg calc">计算</span></div>' +
      '<div class="tx">算法开始执行，已分配计算资源</div></div></div>' +
    '<div class="ti"><div class="tdot">✓</div><div><div class="tt"><b>算法发起</b>' +
      '<span class="tm">' + t1 + '</span><span class="tagg start">发起</span></div>' +
      '<div class="tx">调用厂商算法</div></div></div>' +
    '<div class="ti"><div class="tdot">✓</div><div><div class="tt"><b>匹配成功 — 匹配中 4 款AI工具</b>' +
      '<span class="tm">' + t1 + '</span><span class="tagg match">匹配</span></div>' +
      '<div class="tx">根据匹配规则匹配中以下算法' + algs + '</div></div></div>' +
    '<div class="ti"><div class="tdot">✓</div><div><div class="tt"><b>影像归档成功</b>' +
      '<span class="tm">' + t1 + '</span><span class="tagg arch">归档</span></div>' +
      '<div class="tx">影像归档成功，共 1 个序列<br>图像张数：353</div></div></div>' +
    '<div class="ti"><div class="tdot">✓</div><div><div class="tt"><b>请求接收完成</b>' +
      '<span class="tm">' + t1 + '</span><span class="tagg recv">接收</span></div>' +
      '<div class="tx">数据来源：PACS3</div></div></div>' +
  '</div>';
}

function renderDrw(){
  if (!S.drw) return;
  var r = ROWS.filter(function (x){ return x.id === S.drw; })[0];
  if (!r){ closeDrw(); return; }
  var ok = r.status === '成功';
  var b = document.getElementById('drwBadge');
  b.textContent = ok ? '已完结 · 计算成功' : '已完结';
  b.className = 'badge' + (ok ? '' : '');
  document.getElementById('drwInfo').innerHTML =
    '<div><label>姓名</label><span>' + esc(NAMES[idxOf(r.id) % NAMES.length]) + '</span></div>' +
    '<div><label>机构</label><span title="' + esc(r.org) + '">' + esc(r.org) + '</span></div>' +
    '<div><label>患者号</label><span>' + esc(r.pat) + '</span></div>' +
    '<div><label>检查</label><span>' + esc(r.study) + ' · CT</span></div>' +
    '<div class="full"><label>Study UID</label><span title="' + studyUid(r) + '">' + studyUid(r) + '</span></div>' +
    '<div class="full"><label>AI工具</label><span title="' + esc(r.tool) + '">' + esc(r.tool) + '</span></div>';
  document.getElementById('drwTl').innerHTML = tlHtml(r);
}
function openDrw(id){ S.drw = id; document.getElementById('drw').classList.remove('hidden'); renderDrw(); }
function closeDrw(){ S.drw = ''; document.getElementById('drw').classList.add('hidden'); }

/* ---------- 绑定 ---------- */
(function init(){
  uniq(ROWS.map(function(r){ return r.org; })).forEach(function (o){
    document.getElementById('fOrg').insertAdjacentHTML('beforeend', '<option>' + esc(o) + '</option>');
  });
  TOOLS.forEach(function (t){
    document.getElementById('fTool').insertAdjacentHTML('beforeend', '<option>' + esc(t) + '</option>');
  });

  [].forEach.call(document.querySelectorAll('.tabs div'), function (d){
    d.onclick = function (){
      [].forEach.call(document.querySelectorAll('.tabs div'), function (x){ x.classList.remove('on'); });
      d.classList.add('on'); S.tab = d.getAttribute('data-tab'); S.page = 1; S.sel = {}; render();
    };
  });

  document.getElementById('btnQuery').onclick = function (){
    S.org = document.getElementById('fOrg').value;
    S.tool = document.getElementById('fTool').value;
    S.pat = document.getElementById('fPat').value.trim();
    S.study = document.getElementById('fStudy').value.trim();
    S.page = 1; S.sel = {}; render();
  };
  document.getElementById('btnReset').onclick = function (){
    document.getElementById('fOrg').value = ''; document.getElementById('fTool').value = '';
    document.getElementById('fPat').value = ''; document.getElementById('fStudy').value = '';
    S.org = S.tool = S.pat = S.study = ''; S.page = 1; S.sel = {}; render();
  };

  document.getElementById('tb').onclick = function (e){
    var t = e.target;
    var tr = t.closest ? t.closest('tr[data-row]') : null;
    var ck = t.getAttribute && t.getAttribute('data-ck');
    if (ck){ S.sel[ck] = t.checked; render(); return; }
    var u = t.getAttribute && t.getAttribute('data-upd');
    if (u){ openUpd([u]); return; }
    var v = t.getAttribute && t.getAttribute('data-view');
    if (v){
      var r = ROWS.filter(function(x){ return x.id === v; })[0];
      toast('结果地址：' + (r.url || '—'));
      return;
    }
    if (tr) openDrw(tr.getAttribute('data-row'));
  };
  document.getElementById('ckAll').onclick = function (){
    var rows = view().slice((S.page - 1) * S.size, S.page * S.size);
    var on = this.checked;
    rows.forEach(function (r){ S.sel[r.id] = on; });
    render();
  };
  document.getElementById('btnBatch').onclick = function (){
    var ids = Object.keys(S.sel).filter(function(k){ return S.sel[k]; });
    if (!ids.length){ toast('请先勾选需要更新状态的数据'); return; }
    openUpd(ids);
  };
  document.getElementById('pgPrev').onclick = function (){ if (S.page > 1){ S.page--; render(); } };
  document.getElementById('pgNext').onclick = function (){ S.page++; render(); };
  document.getElementById('pgNums').onclick = function (e){
    var p = e.target.getAttribute && e.target.getAttribute('data-pg');
    if (p){ S.page = +p; render(); }
  };
  document.getElementById('pgSize').onchange = function (){ S.size = +this.value; S.page = 1; render(); };
  document.getElementById('btnUpdOk').onclick = doUpdate;
  document.getElementById('updStatus').onchange = function (){
    var tip = document.getElementById('updTip');
    tip.textContent = this.value === '成功'
      ? '选择「计算成功」并填写结果地址后，被选数据将强制更新为计算成功'
      : '仅更新状态，结果地址可不填';
    tip.style.color = '';
  };
  document.getElementById('drwRefresh').onclick = function (){ renderDrw(); toast('已刷新生命周期'); };
  document.querySelector('[data-drwx]').onclick = closeDrw;
  document.getElementById('drw').onclick = function (e){
    var t = e.target;
    var u = t.getAttribute && t.getAttribute('data-upd');
    if (u){ openUpd([u]); return; }
    var rt = t.getAttribute && t.getAttribute('data-retry');
    if (rt){ toast('已重新提交计算任务（示意）'); return; }
    var v = t.getAttribute && t.getAttribute('data-view');
    if (v){ var r = ROWS.filter(function(x){ return x.id === v; })[0]; toast('结果地址：' + (r.url || '—')); }
  };
  document.getElementById('btnExport').onclick = function (){ toast('已导出当前筛选结果（示意）'); };

  [].forEach.call(document.querySelectorAll('[data-x]'), function (x){ x.onclick = closeUpd; });
  document.getElementById('mkUpd').onclick = function (e){ if (e.target === this) closeUpd(); };

  render();
})();
</script>
</body>
</html>
